name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract changelog section
        run: |
          version="${GITHUB_REF_NAME}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG section for $version" >&2
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md

  docs:
    name: Build and deploy DocC
    # Unpinned, unlike the CI jobs, because DocC's symbol link disambiguation
    # syntax moves with Xcode and the catalogs are authored against the current one.
    runs-on: macos-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show environment
        run: |
          xcodebuild -version
          swift --version

      - name: Locate the documentation catalog
        id: catalog
        run: |
          catalog="$(find Sources -maxdepth 3 -name '*.docc' -print -quit)"
          if [ -z "$catalog" ]; then
            echo "No DocC catalog found, skipping documentation." >&2
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          module="$(basename "$(dirname "$catalog")")"
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "path=$catalog" >> "$GITHUB_OUTPUT"
          echo "module=$module" >> "$GITHUB_OUTPUT"

      - name: Build documentation
        if: steps.catalog.outputs.found == 'true'
        run: |
          set -o pipefail
          xcodebuild docbuild \
            -scheme "${GITHUB_REPOSITORY#*/}" \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/docc \
            2>&1 | tee docbuild.log
          issues="$(grep -iE '(^|[^/])(warning|error): ' docbuild.log \
            | grep -v 'multiple matching' \
            | grep -v -e '/\.build/' -e 'SourcePackages/checkouts/' \
            | grep -iE "doesn't exist at|isn't a disambiguation|missing documentation|not found in|unresolved|external reference" || true)"
          if [ -n "$issues" ]; then
            echo "$issues" >&2
            echo "DocC reported diagnostics" >&2
            exit 1
          fi

      - name: Transform for static hosting
        if: steps.catalog.outputs.found == 'true'
        run: |
          module="${{ steps.catalog.outputs.module }}"
          archive="$(find .build/docc -name "$module.doccarchive" -print -quit)"
          if [ -z "$archive" ]; then
            echo "No $module.doccarchive produced" >&2
            exit 1
          fi
          "$(xcrun --find docc)" process-archive transform-for-static-hosting "$archive" \
            --output-path _site \
            --hosting-base-path "${GITHUB_REPOSITORY#*/}"

      - name: Add a root redirect
        if: steps.catalog.outputs.found == 'true'
        run: |
          module_path="$(echo '${{ steps.catalog.outputs.module }}' | tr '[:upper:]' '[:lower:]')"
          cat > _site/index.html <<HTML
          <!doctype html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=./documentation/$module_path/">
          <link rel="canonical" href="./documentation/$module_path/">
          <title>Documentation</title>
          <a href="./documentation/$module_path/">Continue to the documentation</a>
          HTML

      - name: Upload artifact
        if: steps.catalog.outputs.found == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to Pages
        if: steps.catalog.outputs.found == 'true'
        id: deploy
        uses: actions/deploy-pages@v5
